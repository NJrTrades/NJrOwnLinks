<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJrTrades | Link in Bio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            background-color: #000000;
            color: #f5f5f7;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(28, 28, 30, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card:hover {
            background: rgba(44, 44, 46, 0.75);
            border-color: rgba(255, 255, 255, 0.16);
            transform: translateY(-2px);
        }

        .glass-pill {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .ambient-glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.25;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 relative selection:bg-blue-500 selection:text-white">

    <!-- Ambient Glow Background -->
    <div class="ambient-glow bg-blue-600 top-[-100px] left-[-100px]"></div>
    <div class="ambient-glow bg-purple-600 bottom-[-100px] right-[-100px]"></div>

    <!-- Top Header -->
    <header class="w-full max-w-md mx-auto flex justify-between items-center py-2 z-10">
        <span class="text-xs font-medium text-neutral-400 tracking-wider uppercase">Verified Profile</span>
        <button onclick="requestAccess()" class="glass-pill px-3 py-1.5 rounded-full text-xs font-medium text-neutral-200 hover:bg-white/20 transition flex items-center space-x-1.5 shadow-sm">
            <i data-lucide="lock" class="w-3.5 h-3.5"></i>
            <span>Customize Links</span>
        </button>
    </header>

    <!-- Main Profile Container -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center space-y-6 pt-4 pb-12 z-10">
        <!-- Avatar & Bio -->
        <div class="flex flex-col items-center text-center space-y-3">
            <div class="relative group">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full blur opacity-50 group-hover:opacity-100 transition duration-500"></div>
                <div class="relative w-24 h-24 rounded-full overflow-hidden border border-white/10 bg-neutral-900 flex items-center justify-center shadow-2xl">
                    <img id="profile-avatar" src="https://pbs.twimg.com/profile_images/2106236699189624832/ggIMtBbL_400x400.jpg" alt="NJrTrades" class="w-16 h-16 object-contain">
                </div>
            </div>
            <div class="space-y-1">
                <h1 id="profile-name" class="text-2xl font-semibold tracking-tight text-white flex items-center justify-center space-x-1.5">
                    NJrTrades
                </h1>
                <p id="profile-bio" class="text-xs text-neutral-400 font-medium">Web3 | Trader & Programmer</p>
            </div>
        </div>

        <!-- Dynamic Links Container -->
        <div id="links-container" class="w-full space-y-3.5"></div>
    </main>

    <!-- Footer -->
    <footer class="w-full max-w-md mx-auto text-center space-y-3 text-xs text-neutral-500 pb-6 z-10">
        <p class="text-[11px] text-neutral-500">© 2026 NJrTrades. All rights reserved.</p>
    </footer>

    <!-- Passcode Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-card w-full max-w-xs rounded-3xl p-6 space-y-4 border border-white/15 shadow-2xl text-center">
            <div class="w-12 h-12 rounded-full bg-blue-500/20 text-blue-400 mx-auto flex items-center justify-center">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <div>
                <h3 class="text-base font-semibold text-white">Enter Passphrase</h3>
                <p class="text-xs text-neutral-400 mt-1">Provide your secret key to edit profile links.</p>
            </div>
            <div>
                <input type="password" id="auth-passphrase" placeholder="Secret Phrase" class="w-full bg-neutral-900/90 border border-white/15 rounded-xl px-3.5 py-2.5 text-sm text-center text-white focus:outline-none focus:border-blue-500 transition">
                <p id="auth-error" class="text-xs text-red-400 mt-2 hidden">Incorrect passphrase</p>
            </div>
            <div class="flex space-x-2">
                <button onclick="closeAuthModal()" class="flex-1 glass-pill py-2 rounded-xl text-xs text-neutral-300 hover:bg-white/10 transition">Cancel</button>
                <button onclick="verifyPassphrase()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-xl text-xs transition">Unlock</button>
            </div>
        </div>
    </div>

    <!-- Customizer Drawer / Modal -->
    <div id="drawer" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-card w-full max-w-lg rounded-3xl p-6 space-y-6 max-h-[90vh] overflow-y-auto border border-white/15 shadow-2xl">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <h2 class="text-lg font-semibold text-white flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i>
                    <span>Link Manager & Settings</span>
                </h2>
                <button onclick="toggleDrawer()" class="p-2 rounded-full hover:bg-white/10 text-neutral-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-neutral-300 mb-1">Profile Name</label>
                    <input type="text" id="input-name" class="w-full bg-neutral-900/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-neutral-300 mb-1">Bio Text</label>
                    <input type="text" id="input-bio" class="w-full bg-neutral-900/80 border border-white/10 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
                </div>

                <div class="border-t border-white/10 pt-4">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-semibold text-white">Manage Links</h3>
                        <button onclick="addNewLink()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-medium px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                            <span>Add Link</span>
                        </button>
                    </div>
                    <div id="admin-links-list" class="space-y-3"></div>
                </div>
            </div>

            <div class="flex space-x-3 pt-2 border-t border-white/10">
                <button onclick="saveChanges()" class="flex-1 bg-white text-black font-medium py-2.5 rounded-xl text-sm hover:bg-neutral-200 transition">Save Changes</button>
                <button onclick="resetDefaults()" class="glass-pill px-4 py-2.5 rounded-xl text-sm text-neutral-300 hover:bg-white/10 transition">Reset</button>
            </div>
        </div>
    </div>

    <!-- Inline Script -->
    <script>
        // SHA-256 Hash of default secret: "secret123"
        const SECRET_PHRASE_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function verifyPassphrase() {
            const input = document.getElementById('auth-passphrase').value;
            const hashedInput = await sha256(input);
            
            if (hashedInput === SECRET_PHRASE_HASH) {
                document.getElementById('auth-error').classList.add('hidden');
                closeAuthModal();
                toggleDrawer();
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
            }
        }

        function requestAccess() {
            const authModal = document.getElementById('auth-modal');
            document.getElementById('auth-passphrase').value = '';
            document.getElementById('auth-error').classList.add('hidden');
            authModal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').classList.add('opacity-0', 'pointer-events-none');
        }

        document.getElementById('auth-passphrase')?.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') verifyPassphrase();
        });

        const defaultState = {
            name: "NJrTrades",
            bio: "Web3 | trader of forex, crypto, futures| Programmer Py, Lua, Java, JS",
            avatar: "https://own.page/assets/icons/avatar.svg",
            links: [
                {
                    id: 1,
                    type: "instagram",
                    title: "Jr brady",
                    url: "https://instagram.com/njr_trades",
                    domain: "instagram.com",
                    action: "Follow",
                    icon: "https://own.page/platform-icons/instagram.svg",
                    thumbnails: [
                        "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzG5nXXrReetJGpeq3WJ9Gt36GV1s6BnYb7SA2yd4pNXxq.jpg",
                        "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzvGMxJJNGSBr1G7ibpHeNCyTPSV6YQwPaed9pzdTd7fXz.jpg",
                        "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzwC49Fv7AXEKGVbWysvu9EaE5BaQUsSmSmnMmt2VfzGif.jpg",
                        "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzEZfrfHdJAypCbZmftTYPsVAsGAporHXBrC8v7L6fD1SR.jpg"
                    ]
                },
                {
                    id: 2,
                    type: "tiktok",
                    title: "@njrtrades",
                    url: "https://tiktok.com/@njrtrades",
                    domain: "tiktok.com",
                    action: "Follow",
                    icon: "https://own.page/platform-icons/tiktok.svg",
                    thumbnailsWithViews: [
                        { img: "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzsmdrvY3qU8puPmLYXfqYZ4gYrKT5rL35hoyYEr6AfauX.jpg", views: "6.8K" },
                        { img: "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzJwB4Xjo1N2PQM9KdMUfd6YaAvFuRWgpBWutvy7c1CqF8.webp", views: "11K" },
                        { img: "https://images.own.page/69fc226c-0a3e-43f8-ac40-aede9281306b/Z3V8aUzGhgofzVmyC7TjYJrwKGE5Sve5CmwiVvp7cZUDaPHz8nB.webp", views: "1.9K" }
                    ]
                },
                {
                    id: 3,
                    type: "x",
                    title: "NJRTrades",
                    url: "https://x.com/_NJrTrades",
                    domain: "x.com",
                    action: "Follow",
                    icon: "https://own.page/platform-icons/x.svg",
                    verified: true,
                    desc: "Web3 | trader of forex, crypto, futures| Programmer Py, Lua, Java, JS"
                },
                {
                    id: 4,
                    type: "github",
                    title: "NJrTrades",
                    url: "https://github.com/NJrTrades",
                    domain: "github.com",
                    action: "GitHub",
                    icon: "https://cdn-icons-png.flaticon.com/256/25/25231.png"
                }
            ]
        };

        let currentState = JSON.parse(localStorage.getItem('apple_njr_state')) || defaultState;

        function render() {
            document.getElementById('profile-name').innerHTML = `${currentState.name} <img src="https://own.page/platform-icons/verified.svg" class="w-4 h-4 inline ml-0.5" alt="Verified">`;
            document.getElementById('profile-bio').innerText = currentState.bio;
            document.getElementById('profile-avatar').src = currentState.avatar;

            const container = document.getElementById('links-container');
            container.innerHTML = '';

            currentState.links.forEach(link => {
                const card = document.createElement('a');
                card.href = link.url;
                card.target = "_blank";
                card.rel = "noopener noreferrer";
                card.className = "block glass-card rounded-2xl p-4 transition-all duration-300 group";

                if (link.type === 'instagram' && link.thumbnails) {
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-2">
                                <img src="${link.icon}" alt="Instagram" class="w-4 h-4">
                                <span class="text-xs font-medium text-neutral-400">${link.domain}</span>
                            </div>
                            <span class="text-[11px] glass-pill px-2.5 py-1 rounded-full font-medium text-neutral-200 group-hover:bg-white/20 transition">${link.action}</span>
                        </div>
                        <div class="mb-3">
                            <span class="text-sm font-semibold text-white">${link.title}</span>
                        </div>
                        <div class="grid grid-cols-4 gap-2">
                            ${link.thumbnails.map(img => `<div class="aspect-square rounded-xl overflow-hidden bg-neutral-900 border border-white/5"><img src="${img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"></div>`).join('')}
                        </div>
                    `;
                } else if (link.type === 'tiktok' && link.thumbnailsWithViews) {
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-3">
                            <div class="flex items-center space-x-2">
                                <img src="${link.icon}" alt="TikTok" class="w-4 h-4">
                                <span class="text-xs font-medium text-neutral-400">${link.domain}</span>
                            </div>
                            <span class="text-[11px] glass-pill px-2.5 py-1 rounded-full font-medium text-neutral-200 group-hover:bg-white/20 transition">${link.action}</span>
                        </div>
                        <div class="mb-3">
                            <span class="text-sm font-semibold text-white">${link.title}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-2">
                            ${link.thumbnailsWithViews.map(item => `
                                <div class="relative aspect-[3/4] rounded-xl overflow-hidden bg-neutral-900 border border-white/5">
                                    <img src="${item.img}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                    <div class="absolute bottom-1.5 left-1.5 bg-black/60 backdrop-blur-md text-[10px] px-1.5 py-0.5 rounded-md text-white font-medium border border-white/10">▷ ${item.views}</div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (link.type === 'x') {
                    card.innerHTML = `
                        <div class="flex items-center justify-between mb-2">
                            <div class="flex items-center space-x-2">
                                <img src="${link.icon}" alt="X" class="w-4 h-4">
                                <span class="text-xs font-medium text-neutral-400">${link.domain}</span>
                            </div>
                            <span class="text-[11px] glass-pill px-2.5 py-1 rounded-full font-medium text-neutral-200 group-hover:bg-white/20 transition">${link.action}</span>
                        </div>
                        <div class="flex items-center space-x-1.5 mb-1">
                            <span class="text-sm font-semibold text-white">${link.title}</span>
                            <img src="https://own.page/platform-icons/verified.svg" alt="Verified" class="w-3.5 h-3.5 inline">
                        </div>
                        <p class="text-xs text-neutral-400 leading-relaxed">${link.desc || ''}</p>
                    `;
                } else {
                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center font-bold text-xs text-white">G</div>
                                <span class="text-sm font-semibold text-white">${link.title}</span>
                            </div>
                            <span class="text-[11px] glass-pill px-2.5 py-1 rounded-full font-medium text-neutral-200 group-hover:bg-white/20 transition">${link.action}</span>
                        </div>
                    `;
                }
                container.appendChild(card);
            });

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function toggleDrawer() {
            const drawer = document.getElementById('drawer');
            if (drawer.classList.contains('opacity-0')) {
                drawer.classList.remove('opacity-0', 'pointer-events-none');
                populateAdminForm();
            } else {
                drawer.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        function populateAdminForm() {
            document.getElementById('input-name').value = currentState.name;
            document.getElementById('input-bio').value = currentState.bio;

            const list = document.getElementById('admin-links-list');
            list.innerHTML = '';
            currentState.links.forEach((link, idx) => {
                const item = document.createElement('div');
                item.className = "flex items-center space-x-2 bg-neutral-900/90 p-2.5 rounded-xl border border-white/10";
                item.innerHTML = `
                    <div class="flex-1 space-y-1">
                        <input type="text" value="${link.title}" onchange="updateLinkProp(${idx}, 'title', this.value)" class="w-full bg-transparent text-xs text-white font-medium focus:outline-none border-b border-white/10 pb-1">
                        <input type="text" value="${link.url}" onchange="updateLinkProp(${idx}, 'url', this.value)" class="w-full bg-transparent text-[11px] text-neutral-400 focus:outline-none">
                    </div>
                    <div class="flex flex-col space-y-1">
                        <button onclick="moveLink(${idx}, -1)" class="p-1 hover:bg-white/10 rounded text-neutral-400 hover:text-white"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
                        <button onclick="moveLink(${idx}, 1)" class="p-1 hover:bg-white/10 rounded text-neutral-400 hover:text-white"><i data-lucide="chevron-down" class="w-3.5 h-3.5"></i></button>
                    </div>
                    <button onclick="deleteLink(${idx})" class="p-2 hover:bg-red-500/20 rounded text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                `;
                list.appendChild(item);
            });
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        function updateLinkProp(index, prop, value) {
            currentState.links[index][prop] = value;
        }

        function moveLink(index, direction) {
            const newIndex = index + direction;
            if (newIndex >= 0 && newIndex < currentState.links.length) {
                const temp = currentState.links[index];
                currentState.links[index] = currentState.links[newIndex];
                currentState.links[newIndex] = temp;
                populateAdminForm();
            }
        }

        function deleteLink(index) {
            currentState.links.splice(index, 1);
            populateAdminForm();
        }

        function addNewLink() {
            currentState.links.push({
                id: Date.now(),
                type: "custom",
                title: "New Link",
                url: "https://example.com",
                domain: "example.com",
                action: "Visit"
            });
            populateAdminForm();
        }

        function saveChanges() {
            currentState.name = document.getElementById('input-name').value;
            currentState.bio = document.getElementById('input-bio').value;
            localStorage.setItem('apple_njr_state', JSON.stringify(currentState));
            render();
            toggleDrawer();
        }

        function resetDefaults() {
            localStorage.removeItem('apple_njr_state');
            currentState = JSON.parse(JSON.stringify(defaultState));
            render();
            toggleDrawer();
        }

        window.addEventListener("DOMContentLoaded", () => {
            render();
        });
        render();
    </script>
</body>
</html>
